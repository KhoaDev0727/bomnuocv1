# Test Application Properties
spring.application.name=bomnuoc-backend-test
spring.datasource.url=jdbc:h2:mem:bomnuoc_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable real Redis connection for tests
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Mock JWT Secret for tests
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.access-token-expiration-ms=86400000
app.jwt.refresh-token-expiration-ms=2592000000

# Mock Firebase
firebase.auth.mock-enabled=true
